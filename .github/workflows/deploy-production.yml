name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build e deploy para portal.genesis360care.com.br
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build produção
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: production
          VITE_APP_NAME: 'Gênesis NR-01'
          VITE_APP_URL: 'https://portal.genesis360care.com.br'

      - name: Deploy via rsync para o servidor
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: /var/www/portal.genesis360care.com.br/
          remote_host: ${{ secrets.PROD_SERVER_HOST }}
          remote_user: ${{ secrets.PROD_SERVER_USER }}
          remote_key: ${{ secrets.PROD_SERVER_SSH_KEY }}

      - name: Recarregar Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: sudo systemctl reload nginx

      # ─── Supabase Migrations + Edge Functions ───────────────────
      # Ativo quando SUPABASE_ACCESS_TOKEN estiver configurado nos
      # GitHub Secrets do repositório.
      - name: Aplicar Supabase migrations
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest
        continue-on-error: true

      - name: Push migrations ao banco
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          supabase db push \
            --project-ref ntgdbglvibruhaqfzesx \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Deploy Edge Function send-email
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          supabase functions deploy send-email \
            --project-ref ntgdbglvibruhaqfzesx \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Configurar secrets da Edge Function
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.RESEND_API_KEY != '' }}
        run: |
          supabase secrets set RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --project-ref ntgdbglvibruhaqfzesx
          supabase secrets set FROM_EMAIL="Gênesis 360Care <noreply@genesis360care.com.br>" \
            --project-ref ntgdbglvibruhaqfzesx
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
