name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build e deploy para portal.genesis360care.com.br
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Build produção
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: production
          VITE_APP_NAME: 'Gênesis NR-01'
          VITE_APP_URL: 'https://portal.genesis360care.com.br'

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via rsync para o servidor
        run: |
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }}:/var/www/portal.genesis360care.com.br/

      - name: Recarregar Nginx
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} \
            "sudo systemctl reload nginx" 

      # ─── Supabase Migrations + Edge Functions ───────────────────
      # Ativo quando SUPABASE_DB_PASSWORD e SUPABASE_ACCESS_TOKEN
      # estiverem configurados nos GitHub Secrets do repositório.
      - name: Aplicar migrations via psql
        run: |
          DB_URL="postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.ntgdbglvibruhaqfzesx.supabase.co:5432/postgres"
          psql "$DB_URL" -f supabase/migrations/005_org_settings_email_queue.sql
          psql "$DB_URL" -f supabase/migrations/006_pg_cron_email_queue.sql
        continue-on-error: true

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
        continue-on-error: true

      - name: Deploy Edge Function send-email
        run: |
          supabase functions deploy send-email \
            --project-ref ntgdbglvibruhaqfzesx \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Configurar secrets da Edge Function
        run: |
          supabase secrets set RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
            --project-ref ntgdbglvibruhaqfzesx
          supabase secrets set FROM_EMAIL="Genesis 360Care <noreply@genesis360care.com.br>" \
            --project-ref ntgdbglvibruhaqfzesx
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
